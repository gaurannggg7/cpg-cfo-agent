global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'cpg-cfo-agent'
    scrape_interval: 5s
    scheme: https
    static_configs:
      - targets: ['cpg-cfo-agent.onrender.com']

remote_write:
  - url: ${GRAFANA_CLOUD_REMOTE_WRITE_URL}
    basic_auth:
      username: ${GRAFANA_CLOUD_USERNAME}
      password: ${GRAFANA_CLOUD_API_KEY}